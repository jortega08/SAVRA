pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $request_method $participation_key {
    default "";
    POST savra;
  }
  # The loopback tunnel shares an upstream address. Bound total writes here
  # and let ngrok rate-limit by the actual client address at its edge.
  limit_req_zone $participation_key zone=participation:1m rate=120r/m;
  limit_req_zone $server_name zone=public_api:1m rate=60r/s;
  upstream savra_backend {
    zone savra_backend 64k;
    include /tmp/savra-upstream.conf;
  }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    absolute_redirect off;
    limit_req_status 429;
    limit_req_log_level info;
    proxy_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/api/(responses|participation/start)$ {
      limit_req zone=participation burst=120 nodelay;
      limit_req zone=public_api burst=120 nodelay;
      proxy_pass http://savra_backend;
    }
    location ~ ^/api/(health|meta|questionnaire|participation/(status|completed)|overview|analytics/(academic|permanence|institutional|quality|methodology))$ {
      limit_req zone=public_api burst=120 nodelay;
      proxy_pass http://savra_backend;
    }
    location /api/ { return 404; }
    location = /api { return 404; }
    location ~ ^/(?:assets|branding)/[^/]+$ { try_files $uri =404; }
    location = /index.html {}
    location ~ ^/(?:favicon\.ico|favicon-(?:16x16|32x32)\.png|apple-touch-icon\.png|icon-(?:192|512)\.png)$ { try_files $uri =404; }
    location ~ ^/(?:break/?|consentimiento/?|encuesta/?|gracias/?|observatorio(?:/(?:academico|permanencia|institucional|datos|metodologia))?/?)?$ {
      try_files /index.html =404;
    }
    location / {
      error_page 404 /index.html;
      return 404;
    }
  }
}
